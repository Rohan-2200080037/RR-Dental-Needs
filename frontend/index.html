    <!-- ─── Favicon ──────────────────────────────────────────────── -->

    <link rel="shortcut icon" href="/pwa-192x192.png" />

    <!-- ─── PWA Manifest (vite-plugin-pwa generates manifest.webmanifest) ── -->

    <!-- ─── PWA / Apple Meta Tags ────────────────────────────────── -->
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ─── Windows / Microsoft ──────────────────────────────────── -->

    <meta name="msapplication-tap-highlight" content="no" />

    <!-- ─── Viewport ──────────────────────────────────────────────── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ─── Primary SEO ──────────────────────────────────────────── -->
    <title>RR Dental Needs | Dental Instruments, Equipment &amp; Supplies</title>
    <meta name="description" content="RR Dental Needs is the #1 online store for dental students. Buy pre-clinical instruments, wax carving kits, orthodontic appliances and all dental supplies for 1st, 2nd, 3rd and 4th year BDS students at affordable prices." />
    <meta name="keywords" content="dental instruments, dental supplies, BDS instruments, dental student kit, wax carving, orthodontic appliances, pre-clinical dental, dental equipment India, RR Dental Needs, dental shop online" />
    <meta name="author" content="RR Dental Needs" />
    <meta name="robots" content="index, follow" />

    <!-- ─── Canonical ────────────────────────────────────────────── -->
    <link rel="canonical" href="https://rrdentalneeds.online/" />

    <!-- ─── Open Graph (Facebook / LinkedIn) ─────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RR Dental Needs" />
    <meta property="og:title" content="RR Dental Needs | Dental Instruments, Equipment &amp; Supplies" />
    <meta property="og:description" content="Shop affordable dental instruments and supplies for BDS students. All clinical year requirements — 1st, 2nd, 3rd &amp; 4th Year — delivered fast across India." />
    <meta property="og:url" content="https://rrdentalneeds.online/" />
    <meta property="og:image" content="https://rrdentalneeds.online/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- ─── Twitter Card ──────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@RRDentalNeeds" />
    <meta name="twitter:title" content="RR Dental Needs | Dental Instruments, Equipment &amp; Supplies" />
    <meta name="twitter:description" content="Shop affordable dental instruments and supplies for BDS students. All clinical year requirements delivered fast across India." />
    <meta name="twitter:image" content="https://rrdentalneeds.online/og-image.png" />

    <!-- ─── Structured Data — Organization ───────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "RR Dental Needs",
      "url": "https://rrdentalneeds.online",
      "logo": "https://rrdentalneeds.online/logo.png",
      "description": "RR Dental Needs is the #1 online store for dental students — providing pre-clinical instruments, wax carving kits, and orthodontic appliances for all BDS years at affordable prices.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://rrdentalneeds.online/contact"
      },
      "sameAs": []
    }
    </script>

    <!-- ─── Structured Data — WebSite (enables Google Sitelinks search) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RR Dental Needs",
      "url": "https://rrdentalneeds.online",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://rrdentalneeds.online/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ─── Razorpay SDK ──────────────────────────────────────────── -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
